# Pod efêmero para migração de dados (GCS -> PVC).
# Monta o MESMO PVC do app. Como o volume é RWO, o app DEVE estar em replicas=0
# enquanto este pod existe (ver README, Passo 6).
apiVersion: v1
kind: Pod
metadata:
  name: docs-mcp-maint
  namespace: default
  labels:
    app.kubernetes.io/name: docs-mcp-server
    role: maintenance
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: maint
      image: busybox:1.36
      command: ["sh", "-c", "echo 'maint pod up — /data montado'; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: docs-mcp-data
